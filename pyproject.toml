# Used by Vercel (uv). Keep the pins in sync with requirements.txt, which local installs use.
[project]
name = "kite-kt-tracker"
version = "1.0.0"
description = "KITE: KT tracker for client accounts, newcomers, transactions and SOPs"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.1.3",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-WTF==1.3.0",
    "SQLAlchemy==2.1.5",
    "Werkzeug==3.1.9",
    "Jinja2==3.1.6",
    "WTForms==3.2.2",
    "python-dotenv==1.2.4",
    "cryptography==50.0.2",
    "cffi==2.1.1",
    "psycopg[binary]==3.3.6",
    "msal==1.39.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.vercel]
entrypoint = "wsgi:app"
